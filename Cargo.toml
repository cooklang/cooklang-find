[package]
name = "cooklang-find"
version = "0.6.0"
edition = "2021"
description = "Library for finding and managing Cooklang recipes in the filesystem"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "cooklang_find"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]

[features]
# `ffi` is on by default so the mobile bindings keep building unchanged.
# Rust-only consumers should set `default-features = false` to avoid pulling
# in uniffi and its bindgen chain (goblin, weedle2, cargo_metadata, ...).
default = ["ffi"]
ffi = ["dep:uniffi"]
cli = ["ffi", "uniffi/cli"]

[dependencies]
camino = { version = "1.1", features = ["serde1"] }
glob = "0.3"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
thiserror = "2"
uniffi = { version = "0.28", optional = true }

[dev-dependencies]
tempfile = "3"
indoc = "2"
uniffi = { version = "0.28", features = ["bindgen-tests"] }

[profile.release]
lto = false
# Note: strip = true removes uniffi metadata sections needed for bindgen
# Use "debuginfo" to strip debug info but preserve uniffi metadata
strip = "debuginfo"
opt-level = "s"
panic = "abort"
